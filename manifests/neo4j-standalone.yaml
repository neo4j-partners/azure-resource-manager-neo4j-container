# Example: Neo4j Standalone Instance (Enterprise Edition)
apiVersion: neo4j.com/v1
kind: Neo4j
metadata:
  name: neo4j-standalone
  namespace: default
spec:
  edition: enterprise
  version: "5.26.0"
  license:
    accept: "yes"
  topology:
    mode: Standalone
  storage:
    volumes:
      data:
        mode: Dynamic
        dynamic:
          storageClassName: default
          size: 20Gi
  networking:
    services:
      default:
        type: LoadBalancer
  auth:
    generatePassword: true


# Example: Neo4j Community Edition Standalone
apiVersion: neo4j.com/v1
kind: Neo4j
metadata:
  name: neo4j-community
  namespace: default
spec:
  edition: community
  version: "5.26.0"
  topology:
    mode: Standalone
  storage:
    volumes:
      data:
        mode: Dynamic
        dynamic:
          storageClassName: default
          size: 10Gi
  networking:
    services:
      default:
        type: LoadBalancer
  auth:
    generatePassword: true

